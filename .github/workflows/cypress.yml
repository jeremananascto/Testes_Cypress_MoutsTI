name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ["frontend", "api"]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências e executar testes (${{ matrix.suite }})
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/${{ matrix.suite }}/**/*.cy.js
          browser: chrome
        env:
          CYPRESS_BASE_URL: ${{ vars.BASE_URL || 'https://front.serverest.dev' }}
          CYPRESS_apiUrl: ${{ vars.API_URL || 'https://serverest.dev' }}

      - name: Upload de screenshots em caso de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.suite }}
          path: cypress/screenshots
          if-no-files-found: ignore
